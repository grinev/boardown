description: >-
  Develop a groomed Boardown task autonomously through independent reviews
  and testing, then commit locally. Stop without a commit on a decision
  requiring the user or an external blocker.
start: prepare
steps:
  prepare:
    instruction: steps/prepare.md
    transitions:
      - to: explore
  explore:
    instruction: steps/explore.md
    outcome:
      spec:
        type: string
        required: true
    transitions:
      - to: plan
  plan:
    instruction: steps/plan.md
    outcome:
      plan:
        type: string
        required: true
    transitions:
      - to: plan-review
  plan-review:
    instruction: steps/plan-review.md
    outcome:
      verdict:
        type: enum
        values: [pass, fail]
        required: true
    transitions:
      - when: { verdict: fail }
        to: revise-plan
      - when: { verdict: pass }
        to: implement
  revise-plan:
    instruction: steps/revise-plan.md
    transitions:
      - to: plan-review
  implement:
    instruction: steps/implement.md
    transitions:
      - to: verify
  verify:
    instruction: steps/verify.md
    outcome:
      result:
        type: enum
        values: [pass, fail]
        required: true
    transitions:
      - when: { result: fail }
        to: fix
      - when: { result: pass }
        to: code-review
  code-review:
    instruction: steps/code-review.md
    outcome:
      verdict:
        type: enum
        values: [pass, fail]
        required: true
    transitions:
      - when: { verdict: fail }
        to: fix
      - when: { verdict: pass }
        to: manual-test
  manual-test:
    instruction: steps/manual-test.md
    outcome:
      verdict:
        type: enum
        values: [pass, fail, skipped]
        required: true
    transitions:
      - when: { verdict: fail }
        to: fix
      - when: { verdict: pass }
        to: commit
      - when: { verdict: skipped }
        to: commit
  fix:
    instruction: steps/fix.md
    transitions:
      - to: verify
  commit:
    instruction: steps/commit.md
    transitions:
      - to: report
  report:
    instruction: steps/report.md
